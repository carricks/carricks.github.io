<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Distributed mobile coverage system for a multi-level building</title>
  <desc id="desc">Engineering schematic showing a mobile network, outdoor donor antenna, lightning protection, signal repeater, RF splitter, coaxial riser and three independently connected indoor antennas.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09070f" stop-opacity=".96"/><stop offset="1" stop-color="#010103"/></linearGradient>
    <linearGradient id="rf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .structure{fill:none;stroke:#64748b;stroke-width:1.15;vector-effect:non-scaling-stroke}.subtle{opacity:.28}.device{fill:#05040a;stroke:#c4b5fd;stroke-width:1.35;vector-effect:non-scaling-stroke}.device-line{fill:none;stroke:#e2e8f0;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.rf-path{fill:none;stroke:url(#rf);stroke-width:1.45;stroke-dasharray:6 7;vector-effect:non-scaling-stroke}.label{fill:#f1f5f9;font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:650;letter-spacing:.35px}.meta{fill:#64748b;font-family:Inter,Arial,sans-serif;font-size:10px;letter-spacing:1.35px}.note{fill:#94a3b8;font-family:Inter,Arial,sans-serif;font-size:10.5px}.node{fill:#c4b5fd;filter:url(#glow)}
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="759" rx="28" fill="url(#panel)" stroke="#c4b5fd" stroke-opacity=".2"/>

  <g class="structure">
