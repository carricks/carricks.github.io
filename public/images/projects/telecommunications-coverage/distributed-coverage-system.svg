    <text x="68" y="461" class="meta">MOBILE NETWORK</text><path d="M174 269C225 222 273 199 331 186" class="rf-path"/><path d="M191 292C241 248 280 229 326 218" stroke="#8b5cf6" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 10"/>
  </g>

