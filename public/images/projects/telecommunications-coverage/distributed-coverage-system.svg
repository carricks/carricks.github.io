    <path d="M350 364h740M350 512h740" opacity=".4"/><path d="M542 220v446M830 220v446" opacity=".18"/>
    <path d="M378 272h128v64H378M378 420h128v64H378M378 568h128v64H378" class="subtle"/><path d="M866 272h174v64H866M866 420h174v64H866M866 568h174v64H866" class="subtle"/>
  </g>

