<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid renewable plant control architecture</title>
  <desc id="desc">Conceptual engineering diagram separating electrical power export from measurements, controller setpoints, plant feedback and operator supervision.</desc>
  <defs>
    <marker id="arrowControl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrowPower" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>
      .eyebrow{font:600 18px Arial,sans-serif;letter-spacing:5px;fill:#a78bfa}.heading{font:600 34px Arial,sans-serif;fill:#e5e7eb}.label{font:600 18px Arial,sans-serif;letter-spacing:1.5px;fill:#c4b5fd}.small{font:500 15px Arial,sans-serif;letter-spacing:1.4px;fill:#94a3b8}.micro{font:600 13px Arial,sans-serif;letter-spacing:1.4px;fill:#a78bfa}.box{fill:#060609;stroke:#475569;stroke-width:1.25}.power{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.power-out{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPower)}.control{fill:none;stroke:#a78bfa;stroke-width:1.25;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrowControl);marker-end:url(#arrowControl)}.detail{fill:none;stroke:#c4b5fd;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="#020203"/><rect x="22" y="22" width="1556" height="856" rx="26" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="76" y="82" class="eyebrow">CONCEPTUAL CONTROL ARCHITECTURE</text><text x="76" y="132" class="heading">Coordinated response across hybrid generation.</text><text x="76" y="170" class="small">LOCAL CONTROL · PLANT REGULATION · SUPERVISED GRID CONNECTION</text>
  <g transform="translate(1120 112)"><path d="M0 0h64" class="power"/><text x="78" y="5" class="small">ELECTRICAL PATH</text><path d="M0 30h64" class="control"/><text x="78" y="35" class="small">CONTROL AND FEEDBACK</text></g>

  <!-- Generation sources -->
  <g transform="translate(82 250)"><text class="micro">WIND GENERATION</text><g transform="translate(36 36)"><path d="M62 75v115M22 190h80M62 75 5 28M62 75l91-15M62 75l-22 91" class="power"/><circle cx="62" cy="75" r="6" fill="#c4b5fd"/></g></g>
  <g transform="translate(82 535)"><text class="micro">SOLAR GENERATION</text><g transform="translate(18 45)"><g transform="skewX(-7)"><rect width="168" height="98" rx="3" fill="#050507" stroke="#c4b5fd" stroke-width="1.25"/><path d="M42 0v98M84 0v98M126 0v98M0 32.7h168M0 65.3h168" stroke="#64748b"/></g><path d="M84 98v45M35 143h98" class="power"/><circle cx="208" cy="36" r="25" class="detail"/><path d="M208-3v-15M208 75v15M169 36h-15M262 36h-15M181 9 169-3M247 75l-12-12M235 9l12-12M169 75l12-12" class="detail"/></g></g>

  <!-- Local plant controllers -->
  <g transform="translate(355 225)"><rect width="250" height="210" rx="18" class="box"/><text x="125" y="38" text-anchor="middle" class="label">WIND PPC</text><text x="125" y="62" text-anchor="middle" class="small">LOCAL PLANT CONTROL</text><rect x="36" y="82" width="178" height="82" rx="8" fill="#020203" stroke="#334155"/><path d="M58 145v-26M84 145V105M110 145v-18M136 145V96M162 145v-31M188 145V101" class="detail"/><path d="M55 185h140" class="power"/></g>
  <g transform="translate(355 520)"><rect width="250" height="210" rx="18" class="box"/><text x="125" y="38" text-anchor="middle" class="label">SOLAR PPC</text><text x="125" y="62" text-anchor="middle" class="small">LOCAL PLANT CONTROL</text><rect x="36" y="82" width="178" height="82" rx="8" fill="#020203" stroke="#334155"/><path d="M58 144 86 118l27 17 33-40 38 25" class="detail"/><path d="M55 185h140" class="power"/></g>
  <path d="M255 330H355" class="control"/><text x="305" y="312" text-anchor="middle" class="micro">FIELD I/O</text><path d="M255 625H355" class="control"/><text x="305" y="607" text-anchor="middle" class="micro">FIELD I/O</text>

  <!-- Electrical collection system -->
  <path d="M180 440H720" class="power"/><g transform="translate(615 414)"><circle cx="28" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="70" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="49" y="-17" text-anchor="middle" class="small">TRANSFORMER A</text></g>
  <path d="M184 735H720" class="power"/><g transform="translate(615 709)"><circle cx="28" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="70" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="49" y="-17" text-anchor="middle" class="small">TRANSFORMER B</text></g>
  <path d="M720 440v295" class="power"/><circle cx="720" cy="440" r="5" fill="#94a3b8"/><circle cx="720" cy="735" r="5" fill="#94a3b8"/><text transform="translate(744 670) rotate(-90)" class="small">COMMON COLLECTION BUS</text>

  <!-- Hybrid plant controller -->
  <g transform="translate(850 320)"><rect width="330" height="285" rx="22" class="box"/><text x="165" y="42" text-anchor="middle" class="label">HYBRID PPC</text><text x="165" y="68" text-anchor="middle" class="small">PLANT LEVEL COORDINATION</text><rect x="44" y="92" width="242" height="112" rx="10" fill="#020203" stroke="#334155"/><path d="M68 180 108 139l38 25 46-61 58 42 23-13" class="detail"/><path d="M62 230h206M91 250h148" class="power"/></g>
  <path d="M605 285H760v105h90" class="control"/><text x="725" y="270" text-anchor="middle" class="micro">SETPOINTS · FEEDBACK</text><path d="M605 580H760v-95h90" class="control"/><text x="725" y="565" text-anchor="middle" class="micro">SETPOINTS · FEEDBACK</text>

  <!-- Operator supervision -->
  <g transform="translate(1285 245)"><text x="100" y="0" text-anchor="middle" class="micro">SYSTEM OPERATOR</text><rect y="22" width="200" height="110" rx="16" class="box"/><rect x="38" y="48" width="124" height="56" rx="6" fill="#020203" stroke="#334155"/><path d="M61 88V72M87 88V60M113 88V77M139 88V66" class="detail"/></g><path d="M1180 375h105" class="control"/><text x="1232" y="357" text-anchor="middle" class="micro">SUPERVISION</text>

  <!-- Grid export path: controller does not carry electrical power -->
  <path d="M720 735h566" class="power"/><g transform="translate(1265 709)"><circle cx="28" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="70" cy="26" r="24" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="49" y="-17" text-anchor="middle" class="small">GRID TRANSFORMER</text></g><path d="M1363 735h100" class="power-out"/><circle cx="1478" cy="735" r="10" fill="#020203" stroke="#c4b5fd" stroke-width="1.5"/><text x="1478" y="772" text-anchor="middle" class="micro">GRID POI</text>
  <text x="76" y="850" class="small">PORTFOLIO RECONSTRUCTION · NON PROPRIETARY SYSTEM VIEW</text>
</svg>
