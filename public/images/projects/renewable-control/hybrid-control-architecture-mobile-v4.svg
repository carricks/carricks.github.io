<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Mobile hybrid renewable plant control architecture</title>
  <desc id="desc">Mobile integrated diagram showing wind and solar sources, local controllers, hybrid control, operator supervision and the electrical export path without overlapping labels or lines.</desc>
  <defs>
    <marker id="controlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker><marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker><marker id="powerArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>.eyebrow{font:600 15px Arial,sans-serif;letter-spacing:4px;fill:#a78bfa}.heading{font:600 29px Arial,sans-serif;fill:#e5e7eb}.label{font:600 16px Arial,sans-serif;letter-spacing:1.3px;fill:#c4b5fd}.body{font:500 13px Arial,sans-serif;letter-spacing:.8px;fill:#94a3b8}.micro{font:600 11px Arial,sans-serif;letter-spacing:1px;fill:#a78bfa}.box{fill:#060609;stroke:#475569;stroke-width:1.2}.power{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.powerOut{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;marker-end:url(#powerArrow)}.control{fill:none;stroke:#a78bfa;stroke-width:1.25;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#controlArrow);marker-end:url(#controlArrow)}.feedback{fill:none;stroke:#a78bfa;stroke-width:1.25;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#feedbackArrow)}.detail{fill:none;stroke:#c4b5fd;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:#020203;stroke:#c4b5fd;stroke-width:1.5}</style>
  </defs>
  <rect width="800" height="1500" rx="28" fill="#020203"/><rect x="20" y="20" width="760" height="1460" rx="22" fill="none" stroke="#334155"/>
  <text x="48" y="66" class="eyebrow">CONCEPTUAL CONTROL ARCHITECTURE</text><text x="48" y="110" class="heading">Hybrid generation response.</text><text x="48" y="142" class="body">CONTROL · COORDINATION · GRID EXPORT</text>
  <g transform="translate(460 174)"><path d="M0 0h44" class="power"/><text x="56" y="4" class="body">ELECTRICAL POWER</text><path d="M0 26h44" class="control"/><text x="56" y="30" class="body">CONTROL</text></g>

  <!-- Wind row -->
  <text x="48" y="254" class="label">WIND FARM</text>
  <g aria-label="Three wind turbines">
    <g transform="translate(80 0)"><path d="M0 326-4 424M0 326l-24-23M0 326l28-7M0 326l-8 29M-9 428H9" class="power"/><circle cy="326" r="4" fill="#c4b5fd"/></g>
    <g transform="translate(137 0)"><path d="M0 311-5 424M0 311l-29-29M0 311l34-8M0 311l-10 36M-10 428h20" class="power"/><circle cy="311" r="4.5" fill="#c4b5fd"/></g>
    <g transform="translate(194 0)"><path d="M0 327 4 424M0 327l-24-23M0 327l28-7M0 327l-8 29M-9 428H9" class="power"/><circle cy="327" r="4" fill="#c4b5fd"/></g>
    <path d="M58 428H218" class="power"/>
  </g>
  <g transform="translate(270 235)"><rect width="430" height="180" rx="16" class="box"/><text x="215" y="38" text-anchor="middle" class="label">WIND PPC</text><text x="215" y="64" text-anchor="middle" class="body">FIELD I/O · LOCAL CONTROL</text><rect x="30" y="88" width="370" height="58" rx="7" fill="#020203" stroke="#334155"/><path d="M60 133v-20M93 133V99M126 133v-16M159 133V94M192 133v-27M225 133V98" class="detail"/></g><path d="M225 325H270" class="control"/>
  <path d="M112 440H700" class="power"/><g transform="translate(610 416)"><circle cx="24" cy="24" r="21" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="61" cy="24" r="21" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="42" y="-7" text-anchor="middle" class="body">TRANSFORMER A</text></g><circle cx="716" cy="440" r="4" fill="#94a3b8"/><path d="M700 440H716" class="power"/>

  <!-- Solar row -->
  <text x="48" y="506" class="label">SOLAR GENERATION</text><g transform="translate(52 536)"><g transform="skewX(-7)"><rect width="130" height="78" rx="3" fill="#050507" stroke="#c4b5fd" stroke-width="1.25"/><path d="M33 0v78M65 0v78M98 0v78M0 26h130M0 52h130" stroke="#64748b"/></g><path d="M65 78v37M26 115h77" class="power"/></g>
  <g transform="translate(270 490)"><rect width="430" height="180" rx="16" class="box"/><text x="215" y="38" text-anchor="middle" class="label">SOLAR PPC</text><text x="215" y="64" text-anchor="middle" class="body">FIELD I/O · LOCAL CONTROL</text><rect x="30" y="88" width="370" height="58" rx="7" fill="#020203" stroke="#334155"/><path d="M58 133 93 108l34 19 42-38 49 30 39-20" class="detail"/></g><path d="M190 580H270" class="control"/>
  <path d="M118 695H700" class="power"/><g transform="translate(610 671)"><circle cx="24" cy="24" r="21" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="61" cy="24" r="21" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="42" y="65" text-anchor="middle" class="body">TRANSFORMER B</text></g><circle cx="716" cy="695" r="4" fill="#94a3b8"/><path d="M700 695H716" class="power"/>
  <path d="M716 440V695" class="power"/>

  <!-- Local PPC control paths use two clean right-hand corridors -->
  <g transform="translate(205 825)"><rect width="470" height="245" rx="18" class="box"/><text x="235" y="42" text-anchor="middle" class="label">HYBRID PPC</text><text x="235" y="68" text-anchor="middle" class="body">PLANT LEVEL COORDINATION</text><rect x="38" y="94" width="394" height="102" rx="8" fill="#020203" stroke="#334155"/><path d="M66 176 114 131l44 31 54-64 68 48 86-42" class="detail"/><path d="M66 220h338" class="power"/></g>
  <path d="M700 325H748V760H555V825" class="control"/><path d="M700 580H730V790H405V825" class="control"/>
  <g transform="translate(42 875)"><text x="66" y="0" text-anchor="middle" class="label">OPERATOR</text><rect y="22" width="132" height="92" rx="14" class="box"/><rect x="24" y="46" width="84" height="46" rx="5" fill="#020203" stroke="#334155"/><path d="M42 82V68M59 82V59M76 82V72M93 82V64" class="detail"/></g><path d="M174 943H205" class="control"/>

  <!-- Electrical export and isolated POI feedback -->
  <path d="M716 695V1235H600" class="power"/><g transform="translate(510 1213)"><circle cx="22" cy="22" r="20" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="58" cy="22" r="20" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="-14" text-anchor="middle" class="body">GRID TRANSFORMER</text></g><path d="M510 1235H395" class="powerOut"/><circle cx="375" cy="1235" r="9" class="node"/><text x="375" y="1270" text-anchor="middle" class="label">GRID POI</text>
  <path d="M375 1216V1140H645V1070" class="feedback"/>
  <text x="48" y="1442" class="body">PORTFOLIO RECONSTRUCTION · NON PROPRIETARY VIEW</text>
</svg>
