<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1480" role="img" aria-labelledby="title desc">
  <title id="title">Mobile hybrid renewable plant control architecture</title><desc id="desc">Vertical mobile diagram separating the electrical export path from local control, coordinated setpoints, feedback and operator supervision.</desc>
  <defs><marker id="arrowControl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker><marker id="arrowPower" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
  <style>.eyebrow{font:600 15px Arial,sans-serif;letter-spacing:4px;fill:#a78bfa}.heading{font:600 29px Arial,sans-serif;fill:#e5e7eb}.label{font:600 16px Arial,sans-serif;letter-spacing:1.5px;fill:#c4b5fd}.body{font:500 14px Arial,sans-serif;letter-spacing:.8px;fill:#94a3b8}.tiny{font:600 11px Arial,sans-serif;letter-spacing:1.1px;fill:#94a3b8}.box{fill:#060609;stroke:#475569;stroke-width:1.25}.power{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.power-out{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;marker-end:url(#arrowPower)}.control{fill:none;stroke:#a78bfa;stroke-width:1.25;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrowControl);marker-end:url(#arrowControl)}.detail{fill:none;stroke:#c4b5fd;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="800" height="1480" rx="28" fill="#020203"/><rect x="20" y="20" width="760" height="1440" rx="22" fill="none" stroke="#334155"/>
  <text x="52" y="68" class="eyebrow">CONCEPTUAL CONTROL ARCHITECTURE</text><text x="52" y="113" class="heading">Hybrid generation response.</text><text x="52" y="145" class="body">CONTROL · COORDINATION · GRID EXPORT</text>
  <g transform="translate(492 176)"><path d="M0 0h48" class="power"/><text x="60" y="4" class="tiny">ELECTRICAL PATH</text><path d="M0 26h48" class="control"/><text x="60" y="30" class="tiny">CONTROL</text></g>

  <!-- Wind source and controller -->
  <text x="52" y="254" class="label">WIND GENERATION</text><g transform="translate(66 282)"><path d="M55 66v103M20 169h70M55 66 9 29M55 66l74-12M55 66l-18 75" class="power"/><circle cx="55" cy="66" r="5" fill="#c4b5fd"/></g>
  <g transform="translate(300 250)"><rect width="430" height="190" rx="16" class="box"/><text x="28" y="38" class="label">WIND PPC</text><text x="28" y="64" class="body">LOCAL PLANT CONTROL</text><rect x="28" y="88" width="374" height="68" rx="7" fill="#020203" stroke="#334155"/><path d="M56 138v-24M87 138v-38M118 138v-18M149 138V94M180 138v-29M211 138v-42" class="detail"/><path d="M251 124h120M251 138h88" class="power"/></g>
  <path d="M195 348h105" class="control"/><text x="248" y="330" text-anchor="middle" class="tiny">FIELD I/O</text>

  <!-- Solar source and controller -->
  <text x="52" y="514" class="label">SOLAR GENERATION</text><g transform="translate(54 548)"><g transform="skewX(-7)"><rect width="140" height="86" rx="3" fill="#050507" stroke="#c4b5fd" stroke-width="1.25"/><path d="M35 0v86M70 0v86M105 0v86M0 28.7h140M0 57.3h140" stroke="#64748b"/></g><path d="M70 86v44M28 130h84" class="power"/><circle cx="167" cy="26" r="20" class="detail"/><path d="M167-7v-12M167 59v12M134 26h-12M212 26h-12M144 3l-9-9M199 58l-9-9M190 3l9-9M135 58l9-9" class="detail"/></g>
  <g transform="translate(300 510)"><rect width="430" height="190" rx="16" class="box"/><text x="28" y="38" class="label">SOLAR PPC</text><text x="28" y="64" class="body">LOCAL PLANT CONTROL</text><rect x="28" y="88" width="374" height="68" rx="7" fill="#020203" stroke="#334155"/><path d="M55 140 90 112l34 20 42-42 50 32 38-20" class="detail"/><path d="M282 124h90M282 138h66" class="power"/></g>
  <path d="M195 608h105" class="control"/><text x="248" y="590" text-anchor="middle" class="tiny">FIELD I/O</text>

  <!-- Electrical collection bus on the right -->
  <path d="M120 451h642M124 678h638M762 451v750" class="power"/><circle cx="762" cy="451" r="4" fill="#94a3b8"/><circle cx="762" cy="678" r="4" fill="#94a3b8"/><text x="746" y="748" text-anchor="end" class="tiny">COLLECTION BUS</text>

  <!-- Hybrid controller -->
  <g transform="translate(215 805)"><rect width="440" height="250" rx="18" class="box"/><text x="32" y="42" class="label">HYBRID PPC</text><text x="32" y="68" class="body">PLANT LEVEL COORDINATION</text><rect x="32" y="94" width="376" height="105" rx="8" fill="#020203" stroke="#334155"/><path d="M60 178 108 132l44 31 54-65 68 49 86-43" class="detail"/><path d="M58 224h324" class="power"/></g>
  <path d="M730 345h22v524h-97" class="control"/><path d="M730 605h22v348h-97" class="control"/><text x="740" y="790" text-anchor="end" class="tiny">SETPOINTS · FEEDBACK</text>

  <!-- Operator supervision -->
  <g transform="translate(36 850)"><text class="label">OPERATOR</text><rect y="25" width="130" height="92" rx="14" class="box"/><rect x="24" y="47" width="82" height="46" rx="5" fill="#020203" stroke="#334155"/><path d="M41 82V67M58 82V58M75 82V72M92 82V63" class="detail"/></g><path d="M166 925h49" class="control"/>

  <!-- Grid transformer and POI -->
  <text x="762" y="1136" text-anchor="end" class="tiny">GRID TRANSFORMER</text><g transform="translate(694 1177)"><circle cx="22" cy="22" r="20" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="58" cy="22" r="20" fill="#020203" stroke="#cbd5e1" stroke-width="1.5"/></g><path d="M752 1220v80" class="power-out"/><circle cx="752" cy="1318" r="8" fill="#020203" stroke="#c4b5fd" stroke-width="1.5"/><text x="752" y="1352" text-anchor="middle" class="label">GRID POI</text><text x="752" y="1378" text-anchor="middle" class="body">ELECTRICAL EXPORT</text>
  <text x="52" y="1428" class="tiny">PORTFOLIO RECONSTRUCTION · NON PROPRIETARY VIEW</text>
</svg>
